version: '3.8'

services:
  pdf-decrypt-server:
    build: .
    container_name: pdf-decrypt-server
    ports:
      - "8080:8080"
    volumes:
      - pdf-uploads:/app/uploads
      - pdf-outputs:/app/outputs
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pdf-uploads:
    driver: local
  pdf-outputs:
    driver: local